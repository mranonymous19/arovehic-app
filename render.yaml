services:
  - type: web
    name: arovehic-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false  # set this manually in the Render dashboard (your Supabase connection string)
      - key: SECRET_KEY
        generateValue: true  # used to sign login session cookies
