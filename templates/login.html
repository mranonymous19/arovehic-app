<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Arovehic</title>
<script>try{if(localStorage.getItem('arovehic-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo-144.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --brand:#f0771f;--brand-dark:#c75d10;--brand-ring:rgba(240,119,31,.15);--brand-shadow:rgba(240,119,31,.25);
  --ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f4f6fb;
  --stage:#0e1217;
}
*{box-sizing:border-box}
html{font-size:14px}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:1fr minmax(400px,500px);overflow:hidden}

/* Left: 3D scene (unchanged artwork) */
.stage{position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(14,18,23,.55),rgba(14,18,23,.85)),url('https://images.unsplash.com/photo-1698856712618-448b660a8d1f?fm=jpg&q=75&w=2560&fit=max') center/cover no-repeat,radial-gradient(60% 70% at 40% 50%,#1b2430 0%,var(--stage) 70%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-brand{position:absolute;left:32px;top:28px;z-index:2;display:flex;align-items:center;gap:10px;color:#fff}
.mark{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mark img{width:28px;height:28px;display:block}
.stage-brand .name{font-size:15px;font-weight:700;line-height:1.2}
.stage-brand .sub{font-size:11.5px;font-weight:500;color:#cbd5e1;line-height:1.3}
.tag{position:absolute;left:32px;bottom:36px;max-width:440px;z-index:2;color:#fff}
.tag h2{margin:0 0 6px;font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.tag p{margin:0;color:#cbd5e1;font-size:14px;line-height:1.6}
.credit{position:absolute;right:14px;bottom:10px;z-index:2;font-size:11px;color:#94a3b8}.credit a{color:inherit}

/* Right: sign-in card */
.side{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;padding:32px 24px;background:var(--bg);border-left:1px solid var(--line)}
.card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.04)}
.card-body{padding:24px}
.card h1{margin:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.field{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.input-wrap{position:relative}
input{width:100%;height:40px;padding:0 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);font:400 14px Inter,system-ui,sans-serif;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#94a3b8}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
#password{padding-right:64px}
.toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:600 12.5px Inter,sans-serif;cursor:pointer;transition:background-color .15s,color .15s}
.toggle:hover{background:#f1f5f9;color:var(--ink)}
.toggle:focus-visible,button.go:focus-visible{outline:none;box-shadow:0 0 0 3px var(--brand-ring)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-top:1px solid #f1f5f9;background:rgba(248,250,252,.6);border-radius:0 0 14px 14px}
.foot{font-size:12.5px;color:var(--muted)}
button.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border:1px solid var(--brand);border-radius:9px;background:var(--brand);color:#fff;font:600 14px Inter,sans-serif;cursor:pointer;box-shadow:0 6px 16px var(--brand-shadow);transition:background-color .15s,border-color .15s,box-shadow .15s}
button.go svg{width:15px;height:15px}
button.go:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
button.go:active{transform:translateY(1px)}
.err{display:inline-flex;align-items:center;gap:7px;margin:0 0 16px;padding:4px 11px;border-radius:999px;background:#fef2f2;color:#b91c1c;font-size:12.5px;font-weight:500}
.err::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* Dark mode (same switch as the app's Menu, saved in this browser) */
:root[data-theme="dark"]{color-scheme:dark;--ink:#e5e7eb;--muted:#94a3b8;--line:#263042;--bg:#0b1120;--brand-ring:rgba(240,119,31,.28)}
:root[data-theme="dark"] .card{background:#111827;box-shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25)}
:root[data-theme="dark"] input{background:#111827;border-color:#3a475c}
:root[data-theme="dark"] input::placeholder{color:#64748b}
:root[data-theme="dark"] .card-foot{background:#151e2e;border-top-color:#1c2638}
:root[data-theme="dark"] .toggle:hover{background:#1c2638}
:root[data-theme="dark"] .err{background:rgba(239,68,68,.13);color:#fca5a5}

@media(max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:30vh 1fr;overflow:auto}
  .tag{display:none}
  .stage-brand{left:16px;top:16px}
  .side{border-left:0;border-top:1px solid var(--line);align-items:flex-start;padding:24px 16px}
  input{font-size:16px}
}
@media(max-width:420px){
  .card-foot{flex-direction:column-reverse;align-items:stretch}
  button.go{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <section class="stage" aria-hidden="true">
    <canvas id="scene"></canvas>
    <div class="stage-brand">
      <span class="mark"><img src="{{ url_for('static', filename='img/logo-144.png') }}" alt="" width="28" height="28"></span>
      <div><div class="name">Arovehic</div><div class="sub">Order Desk</div></div>
    </div>
    <div class="tag">
      <h2>Every order, from checkout to doorstep.</h2>
      <p>Track purchases, billing and dispatch for the whole team in one place.</p>
    </div>
    <div class="credit">Photo by <a href="https://unsplash.com/photos/z7pg60IYO4I" target="_blank" rel="noopener">Gerhard Siebert</a> on Unsplash</div>
  </section>

  <main class="side">
    <form class="card" method="POST" action="{{ url_for('login') }}">
      <div class="card-body">
        <h1>Sign in</h1>

        {% if error %}
        <div class="err" role="alert">{{ error }}</div>
        {% endif %}

        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" name="name" required autofocus autocomplete="username" placeholder="Your name">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Your password">
            <button type="button" class="toggle" id="pwToggle" aria-label="Show password">Show</button>
          </div>
        </div>
      </div>
      <div class="card-foot">
        <span class="foot">Arovehic automotive spare parts</span>
        <button type="submit" class="go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Sign in
        </button>
      </div>
    </form>
  </main>

  <script src="{{ url_for('static', filename='vendor/three.min.js') }}"></script>
  <script src="{{ url_for('static', filename='login3d.js') }}"></script>
  <script>
    (function(){
      var t=document.getElementById('pwToggle'),p=document.getElementById('password');
      t.addEventListener('click',function(){
        var show=p.type==='password';
        p.type=show?'text':'password';
        t.textContent=show?'Hide':'Show';
        t.setAttribute('aria-label',show?'Hide password':'Show password');
      });
    })();
  </script>
</body>
</html>
